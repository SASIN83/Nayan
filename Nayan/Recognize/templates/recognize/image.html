{% extends 'recognize/base.html' %}
{% load static %}

{% block strapings %}
<style>
    /* --- PAGE STYLING (Same as Upload Page) --- */
    .upload-page {
        background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        min-height: 100vh;
        padding-top: 80px;
        padding-bottom: 50px;
    }

    /* --- CARDS --- */
    .upload-card, .result-card {
        background: white;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        padding: 40px;
        max-width: 700px; /* Slightly wider for video */
        margin: 0 auto;
        text-align: center;
        transition: all 0.3s ease;
    }

    /* --- VIDEO CONTAINER --- */
    .video-wrapper {
        position: relative;
        width: 100%;
        border-radius: 15px;
        overflow: hidden;
        background: #000;
        margin-bottom: 20px;
        border: 2px solid #31379d;
    }

    #video {
        width: 100%;
        height: auto;
        display: block;
        transform: scaleX(-1); /* Mirror effect for webcam */
    }

    #canvas {
        display: none; /* We only use this for capturing data in background */
    }

    /* --- RESULT IMAGE --- */
    #capturedResultImage {
        width: 100%;
        max-height: 350px;
        object-fit: cover;
        border-radius: 10px;
        margin-bottom: 20px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        transform: scaleX(-1); /* Mirror effect to match video */
    }

    /* --- BUTTONS --- */
    .btn-nayan {
        background: #31379d;
        color: white;
        border-radius: 50px;
        padding: 12px 30px;
        border: none;
        font-weight: 600;
        margin: 5px;
    }
    .btn-nayan:hover { background: #EA1C2C; color: white; }
    
    .btn-secondary-custom {
        background: #e2e6ea;
        color: #31379d;
        border-radius: 50px;
        padding: 12px 30px;
        border: none;
        font-weight: 600;
        margin: 5px;
    }
    .btn-secondary-custom:hover { background: #dbe2ef; }

    /* --- TEXT STYLING --- */
    .data-label { font-size: 0.9rem; color: #888; text-transform: uppercase; margin-top: 15px; }
    .data-value { font-size: 1.5rem; font-weight: 700; color: #31379d; }

    /* --- BADGES --- */
    .category-badge {
        padding: 8px 15px;
        border-radius: 50px;
        font-weight: bold;
        color: white;
        background: #31379d;
        display: inline-block;
        white-space: normal;
        word-break: break-word;
        max-width: 100%;
        line-height: 1.2;
    }
    .bg-criminal { background-color: #EA1C2C !important; }
    .bg-missing { background-color: #f1c40f !important; color: black !important; }
    .bg-safe { background-color: #2ecc71 !important; }
</style>
{% endblock %}

{% block body %}
<div class="upload-page">
    <div class="container">
        
        <div class="row justify-content-center">
            <div class="col-md-8" id="alertBox"></div>
        </div>

        <div class="row" id="cameraSection">
            <div class="col-12">
                <div class="upload-card">
                    <h3>Live Face Detection</h3>
                    <p class="text-muted mb-4">Position your face within the frame</p>

                    <div class="video-wrapper">
                        <video id="video" autoplay playsinline muted></video>
                        <canvas id="canvas"></canvas>
                    </div>

                    <div class="mt-3">
                        <button id="switchCamera" class="btn btn-secondary-custom">
                            <i class="fas fa-sync-alt"></i> Switch Camera
                        </button>
                        <button id="capturePhoto" class="btn btn-nayan">
                            <i class="fas fa-camera"></i> Capture & Analyze
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="row" id="resultSection" style="display: none;">
            <div class="col-12">
                <div class="result-card">
                    <h3 class="text-success mb-4">
                        <i class="fa fa-check-circle"></i> Scan Complete
                    </h3>
                    
                    <img id="capturedResultImage" src="" alt="Captured Face">

                    <div class="d-flex flex-column align-items-center mt-4">
                        
                        <div class="name-section mb-4">
                            <div class="data-label">Name</div>
                            <div class="data-value" id="display_name">--</div>
                        </div>

                        <div class="category-section">
                            <div class="data-label">Category</div>
                            <div class="data-value">
                                <span class="category-badge" id="display_category">--</span>
                            </div>
                        </div>

                    </div>

                    <button class="btn btn-outline-secondary mt-5" onclick="resetCamera()">
                        <i class="fa fa-arrow-left"></i> Scan Another
                    </button>
                </div>
            </div>
        </div>

    </div>
</div>

<form method="post" id="form-image" enctype="multipart/form-data" action="{% url 'recognize:image' %}" style="display: none;">
    {% csrf_token %}
    <input type="hidden" name="image" id="face-image">
</form>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const captureBtn = document.getElementById('capturePhoto');
        let currentStream = null;
        let facingMode = 'user';

        // --- 1. START CAMERA ---
        async function startCamera() {
            try {
                if (currentStream) currentStream.getTracks().forEach(t => t.stop());

                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: facingMode, width: { ideal: 1280 }, height: { ideal: 720 } }
                });
                video.srcObject = stream;
                currentStream = stream;

                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                };
            } catch (err) {
                showError("Camera Access Denied or Not Found.");
                console.error(err);
            }
        }

        // --- 2. CAPTURE LOGIC ---
        captureBtn.addEventListener('click', () => {
            // Draw video to canvas
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // Get Base64 image
            const imageData = canvas.toDataURL('image/png');
            document.getElementById('face-image').value = imageData;
            
            // Show loading state (optional: disable button)
            captureBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Analyzing...';
            captureBtn.disabled = true;

            // Prepare Form
            const formData = new FormData(document.getElementById('form-image'));
            const formAction = document.getElementById('form-image').action;
            const csrftoken = document.querySelector('[name=csrfmiddlewaretoken]').value;

            // Send to Backend
            fetch(formAction, {
                method: 'POST',
                body: formData,
                headers: { 'X-CSRFToken': csrftoken }
            })
            .then(response => response.json())
            .then(data => {
                captureBtn.innerHTML = '<i class="fas fa-camera"></i> Capture & Analyze';
                captureBtn.disabled = false;
                
                // Show Results
                showResultScreen(data, imageData);
            })
            .catch(error => {
                console.error("Error:", error);
                captureBtn.innerHTML = '<i class="fas fa-camera"></i> Capture & Analyze';
                captureBtn.disabled = false;
                showError("Network Error or Server Issue.");
            });
        });

        // --- 3. SHOW RESULTS ---
        window.showResultScreen = function(data, imageSrc) {
            const cameraSec = document.getElementById('cameraSection');
            const resultSec = document.getElementById('resultSection');
            const nameEl = document.getElementById('display_name');
            const catEl = document.getElementById('display_category');
            const resImg = document.getElementById('capturedResultImage');

            // Set Image
            resImg.src = imageSrc;

            // Set Data
            nameEl.innerText = data.name || "Unknown";
            const catText = data.category || "Unknown";
            catEl.innerText = catText;

            // Color Logic
            catEl.className = 'category-badge';
            if (catText.toLowerCase().includes('criminal') || catText.toLowerCase().includes('red')) {
                catEl.classList.add('bg-criminal');
            } else if (catText.toLowerCase().includes('missing') || catText.toLowerCase().includes('yellow')) {
                catEl.classList.add('bg-missing');
            } else {
                catEl.classList.add('bg-safe');
            }

            // Swap Screens
            cameraSec.style.display = 'none';
            resultSec.style.display = 'block';
        };

        // --- 4. RESET ---
        window.resetCamera = function() {
            document.getElementById('resultSection').style.display = 'none';
            document.getElementById('cameraSection').style.display = 'block';
            document.getElementById('alertBox').innerHTML = "";
        };

        // --- 5. UTILS ---
        document.getElementById('switchCamera').addEventListener('click', () => {
            facingMode = facingMode === 'user' ? 'environment' : 'user';
            startCamera();
        });

        function showError(msg) {
            const box = document.getElementById('alertBox');
            box.innerHTML = `<div class="alert alert-danger alert-dismissible fade show">
                                <strong>Error:</strong> ${msg}
                                <button type="button" class="close" data-dismiss="alert">&times;</button>
                             </div>`;
        }

        // Init
        startCamera();
    });
</script>
{% endblock %}
