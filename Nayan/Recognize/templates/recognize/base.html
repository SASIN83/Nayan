<!doctype html>
<html lang="en">

<head>
    <script src="https://unpkg.com/scroll-out/dist/scroll-out.min.js"></script>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <link href="https://fonts.googleapis.com/css?family=Nunito:200,300,400,700" rel="stylesheet">

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
        integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    
    {% load static %}
    
    {% block strapings %}
    {% endblock %}
    
    <link rel="stylesheet" type="text/css" href="{% static 'recognize/app2.css' %}">
    <link rel="stylesheet" href="{% static 'recognize/Rfloat.css' %}">
    <link rel="stylesheet" href="{% static 'recognize/land.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'recognize/wave.css' %}">

    <title>{% block title %}NAYAN{% endblock %}</title>

</head>

<body>
    {% csrf_token %}
    
    <nav id="mainNavbar" class="navbar navbar-light navbar-expand-md py-0 fixed-top">        
        <a href="{% url 'recognize:home' %}" class="navbar-brand">
            <img src="{% static 'images/logo.png' %}" alt="Nayan Logo" width="60px" height="40px">
        </a>
        <button class="navbar-toggler" data-toggle="collapse" data-target="#navLinks" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navLinks">
            <ul class="navbar-nav ml-auto"> <li class="nav-item">
                    <a href="{% url 'recognize:home' %}" class="nav-link">HOME</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">ABOUT</a>
                </li>
                <li class="nav-item">
                    <a href="#Services" class="nav-link">SERVICE</a>
                </li>
            </ul>
        </div>
    </nav>

    {% block body %}
    {% endblock %}


    <div class="hoe" id="win">
        <div class="action">
            <div class="profile" onclick="menuToggle();">
                <img src="{% static 'images/20943401.jpg' %}" alt="Profile">
            </div>

            <div class="menu">
                <h3>NAYAN<br><span>The third eye</span></h3>
                <ul class="px-0">
                    <li>
                        <img src="{% static 'images/float0.png' %}"/>
                        <a href="{% url 'recognize:home' %}">Home</a>
                    </li>
                    <li>
                        <img src="{% static 'images/float1.png' %}"/>
                        <a href="{% url 'recognize:video' %}">Videostream</a>
                    </li>
                    <li>
                        <img src="{% static 'images/float2.png' %}"/>
                        <a href="{% url 'recognize:upload' %}">Image upload</a>
                    </li>
                    <li>
                        <img src="{% static 'images/float3.png' %}"/>
                        <a href="{% url 'recognize:gallary' %}">Gallary</a>
                    </li>
                    <li>
                        <img src="{% static 'images/float6b.png' %}"/>
                        <a href="{% url 'recognize:image' %}">Image Capture</a>
                    </li>
                    <li>
                        <img src="{% static 'images/forms4.png' %}"/>
                        <a href="https://forms.gle/Q8ojjQUYE3nNRcU39">F.I.R</a>
                    </li>
                </ul>
            </div>
        </div>
    </div>


    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js"
        integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49"
        crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js"
        integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy"
        crossorigin="anonymous"></script>
    <script src="{% static 'recognize/land.js' %}"></script>
    

    <script>
        $(function () {
            $(document).scroll(function () {
                var $nav = $("#mainNavbar");
                $nav.toggleClass("scrolled", $(this).scrollTop() > $nav.height());
            });
        });

        function menuToggle() {
            const togglleMenu = document.querySelector('.menu');
            togglleMenu.classList.toggle('active');
        }

        // Close menu when clicking outside
        document.addEventListener('click', function (event) {
            const menu = document.querySelector('.menu');
            const profile = document.querySelector('.profile');
            // Check if click was outside menu and profile button
            if (menu && profile && !menu.contains(event.target) && !profile.contains(event.target)) {
                menu.classList.remove('active');
            }
        });
        $(document).click(function (event) {
            var clickover = $(event.target);
            var $navbar = $(".navbar-collapse");               
            var _opened = $navbar.hasClass("show");
            
            // If open, and the click was NOT on the toggler button or the menu itself
            if (_opened === true && !clickover.hasClass("navbar-toggler")) {
                $navbar.collapse('hide');
            }
        });
        

        ScrollOut({ targets: ".scroll", offset: 400 });
        ScrollOut({ targets: ".scroll2", offset: 800 });
        ScrollOut({ targets: ".scroll3", offset: 1600 });

        // Wave Animation
        let wave1 = document.getElementById('wave1');
        let wave2 = document.getElementById('wave2');
        let wave3 = document.getElementById('wave3');
        let wave4 = document.getElementById('wave4');

        window.addEventListener('scroll', function () {
            let value = window.scrollY;
            if(wave1) wave1.style.backgroundPositionX = 400 + value * 4 + 'px';
            if(wave2) wave2.style.backgroundPositionX = 300 + value * -4 + 'px';
            if(wave3) wave3.style.backgroundPositionX = 200 + value * 2 + 'px';
            if(wave4) wave4.style.backgroundPositionX = 100 + value * -2 + 'px';
        })
    </script>

</body>

</html>
