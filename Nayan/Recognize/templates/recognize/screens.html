{% extends 'recognize/base.html' %}
{% block title %}Live Recognition{% endblock %}
{% block body %}
    <section class="container-fluid">
        <div class="row align-items-center">
            <div class="col-12 col-lg-6">
                <div class="text text-center mt-5">
                    <h1 class="bro">Live Recognition</h1>
                    
                    <div class="video-container mb-3">
                        <video id="video" autoplay playsinline muted></video>
                        <canvas id="canvas"></canvas>
                    </div>

                    <div class="button-group d-flex flex-column flex-sm-row justify-content-center gap-2 mb-3">
                        <button id="switchCamera" class="btn btn-info btn-mobile">
                            <i class="fas fa-sync-alt"></i> Switch Cam
                        </button>
                        <button id="toggleStream" class="btn btn-primary btn-mobile">
                            <i class="fas fa-play"></i> Start Stream
                        </button>
                    </div>
                    
                    <div id="result" class="mt-3 fw-bold"></div>
                </div>
            </div>

            <div class="col-12 col-lg-6 px-0 d-none d-lg-block">
                <img class="ho img-fluid" src="https://image.freepik.com/free-vector/e-sport-game-streaming-abstract-concept-illustration_335657-2197.jpg" alt="">
            </div>
        </div>
    </section>

    <style>
        .video-container {
            position: relative; /* Critical for overlay */
            display: inline-block;
            width: 100%;
            max-width: 640px;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }

        #video {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Canvas overlays perfectly on top of video */
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }
    </style>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const resultDiv = document.getElementById('result');
        const toggleBtn = document.getElementById('toggleStream');
        
        let isStreaming = false;
        let streamInterval = null;
        let currentStream = null;
        let facingMode = 'user';

        // 1. Setup Camera
        async function startCamera() {
            try {
                if (currentStream) currentStream.getTracks().forEach(t => t.stop());
                
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: facingMode, width: { ideal: 640 }, height: { ideal: 480 } } 
                });
                video.srcObject = stream;
                currentStream = stream;
                
                // Wait for video to load to set canvas size
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                };
            } catch (err) {
                resultDiv.innerHTML = `<span class="text-danger">Camera Error: ${err.message}</span>`;
            }
        }

        // 2. The Loop: Capture -> Send -> Draw
        function sendFrame() {
            if (!isStreaming) return;

            // Draw current video frame to hidden canvas for data extraction
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = video.videoWidth;
            tempCanvas.height = video.videoHeight;
            tempCanvas.getContext('2d').drawImage(video, 0, 0);
            
            const imageData = tempCanvas.toDataURL('image/jpeg', 0.7); // 0.7 quality for speed

            fetch('/app/process_image/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
                body: JSON.stringify({ image: imageData })
            })
            .then(res => res.json())
            .then(data => {
                // Clear previous drawings
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                if (data.name && data.name !== 'Unknown') {
                    const coords = data.coords;
                    
                    // Set Color based on category
                    let color = '#00FF00'; // Green
                    if (data.category.includes('Criminal')) color = '#FF0000'; // Red
                    if (data.category.includes('Missing')) color = '#FFFF00'; // Yellow

                    // Draw Box
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 3;
                    ctx.strokeRect(coords.x, coords.y, coords.w, coords.h);

                    // Draw Text Background
                    ctx.fillStyle = color;
                    ctx.fillRect(coords.x, coords.y - 30, coords.w, 30);

                    // Draw Name
                    ctx.fillStyle = '#000';
                    ctx.font = 'bold 16px Arial';
                    ctx.fillText(data.name, coords.x + 5, coords.y - 8);
                    
                    resultDiv.innerHTML = `<span style="color:${color}">${data.name} Found!</span>`;
                } else {
                     // Optional: Draw grey box for unknown
                     // ctx.strokeStyle = 'grey';
                     // ctx.strokeRect(data.coords.x, data.coords.y, data.coords.w, data.coords.h);
                }
            })
            .catch(err => console.error(err));
        }

        // 3. Button Logic
        toggleBtn.addEventListener('click', () => {
            isStreaming = !isStreaming;
            if (isStreaming) {
                toggleBtn.innerHTML = '<i class="fas fa-stop"></i> Stop Stream';
                toggleBtn.classList.replace('btn-primary', 'btn-danger');
                // Send a frame every 500ms (adjust for speed vs performance)
                streamInterval = setInterval(sendFrame, 500); 
            } else {
                toggleBtn.innerHTML = '<i class="fas fa-play"></i> Start Stream';
                toggleBtn.classList.replace('btn-danger', 'btn-primary');
                clearInterval(streamInterval);
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        });

        document.getElementById('switchCamera').addEventListener('click', () => {
            facingMode = facingMode === 'user' ? 'environment' : 'user';
            startCamera();
        });

        // Initialize
        startCamera();
    </script>
{% endblock %}
