{% extends 'recognize/gallarybase.html' %}
{% load static %}
{%block strapings%}
<link rel="stylesheet"  type = "text/css" href="{% static 'recognize/gallary.css' %}">
{%endblock%}
{% block banner %}
<div class="container text-primary">
    <h1 class="didi text-center">Gallery</h1>
    <div class="row justify-content-center">
      <form action="" method="post" class="col-12 col-md-8 col-lg-6">
      {% csrf_token %}
      <div class="row align-items-end">
        <div class="col-12 col-md-6 mb-3">
            <label for="id_filter" class="form-label">Filter:</label>
            {{filterform.filter}}
        </div>
        <div class="col-12 col-md-6 mb-3">
           <button type="submit" class="btn btn-primary w-100">Filter</button>
        </div>
      </div>
      </form>
    </div>
    <hr>
  <div class="row">
        {% for x in img %}
        <div class="col-6 col-md-4 col-lg-3 mb-3">
            <div class="card h-100 hover-shadow">
                <img src="{{x.photo.url}}" alt="{{x.title}}" class="card-img-top img-fluid" style="height: 200px; object-fit: cover;" />
                <div class="card-body d-flex flex-column">
                    <h6 class="card-title">{{x.title}}</h6>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
{% endblock %}
